[project]
name = "soduko-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "reza Kangaroo", email = "reza862018@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
    "tensorflow>=2.21.0",
    "tqdm>=4.70.1",
]

[project.scripts]
soduko-ml = "soduko_ml:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
