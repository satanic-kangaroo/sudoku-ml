<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
    background: transparent;
  }
  .drop-zone {
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    padding: 1.5rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    background: #ffffff;
    user-select: none;
  }
  .drop-zone:hover,
  .drop-zone.dragover {
    border-color: #4f46e5;
    background: #eef2ff;
  }
  .drop-zone.processing {
    pointer-events: none;
    opacity: 0.7;
  }
  .icon { font-size: 1.75rem; line-height: 1; margin-bottom: 0.5rem; }
  .title { font-weight: 600; font-size: 0.95rem; color: #0f172a; }
  .subtitle { font-size: 0.8rem; color: #64748b; margin-top: 0.25rem; }
  input[type="file"] { display: none; }
  .preview-wrap {
    margin-top: 0.75rem;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
    background: #f8fafc;
    display: none;
  }
  .preview-wrap.visible { display: block; }
  .preview { display: block; width: 100%; height: auto; max-height: 260px; object-fit: contain; }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 0.75rem;
    background: #f8fafc;
    border-top: 1px solid #e5e7eb;
    font-size: 0.78rem;
    color: #475569;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .badge { background: #eef2ff; color: #4f46e5; padding: 0.15rem 0.5rem;
           border-radius: 999px; font-weight: 600; font-size: 0.72rem; }
  .badge.success { background: #ecfdf5; color: #059669; }
  .clear-btn {
    background: transparent; border: 1px solid #e5e7eb; border-radius: 6px;
    padding: 0.25rem 0.6rem; font-size: 0.75rem; color: #64748b;
    cursor: pointer; transition: all 0.15s;
  }
  .clear-btn:hover { border-color: #dc2626; color: #dc2626; }
  .error {
    color: #dc2626; font-size: 0.8rem; margin-top: 0.5rem;
    padding: 0.5rem 0.75rem; background: #fef2f2; border-radius: 8px;
    border: 1px solid #fecaca; display: none;
  }
  .error.visible { display: block; }
</style>
</head>
<body>

<div class="drop-zone" id="drop-zone">
  <div class="icon">📷</div>
  <div class="title">Drop image or click to browse</div>
  <div class="subtitle" id="subtitle">PNG · JPG · WebP</div>
</div>

<div class="preview-wrap" id="preview-wrap">
  <img class="preview" id="preview" alt="preview" />
  <div class="meta">
    <span id="size-info"></span>
    <span class="badge success" id="saving-badge"></span>
    <button class="clear-btn" id="clear-btn" type="button">Clear</button>
  </div>
</div>

<div class="error" id="error"></div>
<input type="file" id="file-input" accept="image/*" />

<script>
/* ============================================================
   Minimal inline implementation of the Streamlit component protocol.
   No external dependencies — works offline and on Streamlit Cloud.
   ============================================================ */
(function () {
  const RENDER_EVENT = "streamlit:render";

  window.Streamlit = {
    RENDER_EVENT: RENDER_EVENT,
    events: {
      _listeners: {},
      addEventListener(type, cb) {
        (this._listeners[type] = this._listeners[type] || []).push(cb);
      },
      _dispatch(event) {
        (this._listeners[event.type] || []).forEach((cb) => cb(event));
      },
    },
    setComponentReady() {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
        "*"
      );
    },
    setFrameHeight(height) {
      window.parent.postMessage(
        {
          isStreamlitMessage: true,
          type: "streamlit:setFrameHeight",
          height: height || document.documentElement.scrollHeight,
        },
        "*"
      );
    },
    setComponentValue(value) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: value },
        "*"
      );
    },
  };

  // Listen for render events from the parent
  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === RENDER_EVENT) {
      window.Streamlit.events._dispatch(event.data);
    }
  });

  // Notify the parent that we're alive
  window.Streamlit.setComponentReady();
  window.Streamlit.setFrameHeight();
})();


/* ============================================================
   Uploader logic
   ============================================================ */
(function () {
  const dropZone    = document.getElementById("drop-zone");
  const fileInput   = document.getElementById("file-input");
  const previewWrap = document.getElementById("preview-wrap");
  const preview     = document.getElementById("preview");
  const sizeInfo    = document.getElementById("size-info");
  const savingBadge = document.getElementById("saving-badge");
  const clearBtn    = document.getElementById("clear-btn");
  const errorBox    = document.getElementById("error");
  const subtitle    = document.getElementById("subtitle");

  let MAX_DIMENSION = 1000;
  let JPEG_QUALITY  = 0.85;

  // ---- Config from Python --------------------------------------
  window.Streamlit.events.addEventListener(window.Streamlit.RENDER_EVENT, (event) => {
    const args = (event && event.args) || {};
    if (args.max_dimension) MAX_DIMENSION = args.max_dimension;
    if (args.quality)       JPEG_QUALITY  = args.quality;
    subtitle.textContent = `PNG · JPG · WebP — max ${MAX_DIMENSION}px`;
    window.Streamlit.setFrameHeight();
  });

  // ---- Helpers -------------------------------------------------
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add("visible");
    window.Streamlit.setFrameHeight();
  }
  function hideError() {
    errorBox.classList.remove("visible");
    errorBox.textContent = "";
  }
  function reset() {
    fileInput.value = "";
    previewWrap.classList.remove("visible");
    preview.removeAttribute("src");
    sizeInfo.textContent = "";
    savingBadge.textContent = "";
    hideError();
    window.Streamlit.setFrameHeight();
  }

  // ---- Events --------------------------------------------------
  dropZone.addEventListener("click", () => fileInput.click());
  clearBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    reset();
    window.Streamlit.setComponentValue(null);
  });

  ["dragenter", "dragover"].forEach((ev) =>
    dropZone.addEventListener(ev, (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    })
  );
  ["dragleave", "drop"].forEach((ev) =>
    dropZone.addEventListener(ev, (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
    })
  );
  dropZone.addEventListener("drop", (e) => {
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });

  // ---- Core ----------------------------------------------------
  async function handleFile(file) {
    hideError();

    if (!file.type.startsWith("image/")) {
      showError("Not an image file.");
      return;
    }

    dropZone.classList.add("processing");
    sizeInfo.textContent = "Processing…";
    window.Streamlit.setFrameHeight();

    try {
      const bitmap = await createImageBitmap(file);
      let { width, height } = bitmap;

      if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
        const scale = MAX_DIMENSION / Math.max(width, height);
        width  = Math.round(width  * scale);
        height = Math.round(height * scale);
      }

      const canvas = document.createElement("canvas");
      canvas.width  = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(bitmap, 0, 0, width, height);
      if (bitmap.close) bitmap.close();

      const blob = await new Promise((resolve) =>
        canvas.toBlob(resolve, "image/jpeg", JPEG_QUALITY)
      );
      if (!blob) throw new Error("Failed to encode image.");

      // Preview
      const previewUrl = URL.createObjectURL(blob);
      preview.src = previewUrl;
      previewWrap.classList.add("visible");

      const origKB = (file.size / 1024).toFixed(1);
      const newKB  = (blob.size / 1024).toFixed(1);
      const saving = Math.round((1 - blob.size / file.size) * 100);

      sizeInfo.textContent = `${width}×${height} · ${origKB} KB → ${newKB} KB`;
      savingBadge.textContent = saving > 0 ? `−${saving}%` : `${newKB} KB`;

      // ---- CRITICAL: send as base64 data URL (JSON-safe) ----
      const dataUrl = await blobToDataURL(blob);

      window.Streamlit.setComponentValue({
        data_url: dataUrl,                          // ← base64 string
        width: width,
        height: height,
        original_size: file.size,
        optimized_size: blob.size,
        mime_type: "image/jpeg",
        name: file.name.replace(/\.[^.]+$/, "") + ".jpg",
      });

    } catch (err) {
      showError(err.message || "Something went wrong.");
      console.error(err);
    } finally {
      dropZone.classList.remove("processing");
      window.Streamlit.setFrameHeight();
    }
  }

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload  = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(blob);
    });
  }
})();
</script>
</body>
</html>
