[project]
name = "sudoku-ml"
version = "0.1.0"
description = "Sudoku Solver with Deep Learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "opencv-python-headless>=4.9",
    "tensorflow-cpu>=2.15,<2.20",
    "pillow>=10.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "streamlit>=1.30",
    "scikit-learn>=1.4",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sudoku_solver"]